<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيت الفروج | Chicken House</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8ef;color:#222}
header{background:#191919;color:#fff;padding:22px 16px;text-align:center;position:sticky;top:0;z-index:5}
.logo{font-size:30px;font-weight:900;color:#ffb000}.sub{opacity:.85}
.container{max-width:900px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#201b16,#8c3d10);color:#fff;border-radius:22px;padding:28px;margin-bottom:20px}
.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0}
.lang{margin-top:14px;display:flex;gap:8px}.lang button,.add,.checkout{border:0;border-radius:12px;padding:10px 14px;font-weight:bold;cursor:pointer}
.lang button{background:#fff;color:#222}.lang button.active{background:#ffb000}
.section{margin:25px 0 12px;font-size:24px;font-weight:900}
.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center;box-shadow:0 4px 16px #00000012}
.name{font-weight:800;font-size:18px}.price{color:#b84a00;font-weight:900;white-space:nowrap}.add{background:#ffb000;color:#111}
.cart{background:#171717;color:#fff;border-radius:20px;padding:20px;margin-top:25px}.cart h2{margin-top:0}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #444}
.total{font-size:22px;font-weight:900;margin:14px 0}.checkout{background:#20c76b;color:#fff;width:100%;font-size:18px}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:6px 0;font-size:16px}
.small{font-size:13px;opacity:.75}.empty{opacity:.7}
</style>
</head>
<body>
<header>
  <div class="logo">🍗 CHICKEN HOUSE</div>
  <div class="sub">بيت الفروج</div>
</header>
<div class="container">
<section class="hero">
  <h1>أشهى الفروج والمشاوي يومياً 🔥</h1>
  <p>اطلب أونلاين وسيتم إرسال طلبك مباشرة عبر واتساب.</p>
  <div class="lang"><button class="active" onclick="setLang('ar')">العربية</button><button onclick="setLang('tr')">Türkçe</button><button onclick="setLang('en')">English</button></div>
</section>

<div id="menu"></div>

<section class="cart">
<h2 id="cartTitle">🛒 طلبك</h2>
<div id="cartItems" class="empty">لم تضف أي صنف بعد.</div>
<div class="total" id="total">المجموع: 0 ليرة</div>
<input id="customer" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">
<textarea id="address" rows="3" placeholder="العنوان / ملاحظات التوصيل"></textarea>
<button class="checkout" onclick="sendOrder()">إرسال الطلب عبر واتساب</button>
<p class="small">سيتم فتح واتساب برسالة جاهزة تحتوي تفاصيل طلبك.</p>
</section>
</div>

<script>
const WA="905346992714";
const products=[
["🍗","فروجة مشوية","Izgara Tavuk",450],
["🔥","فروجة مشوية + نصف كيلو شاورما","Izgara Tavuk + 500g Döner",750],
["🍗","فروجة مشوية + وجبة بروستد","Izgara Tavuk + Broasted Menü",650],
["🍗","فروجة مشوية + وجبة كريسبي","Izgara Tavuk + Crispy Menü",650],
["🍗","فروج بروستد كامل","Bütün Broasted Tavuk",500],
["🍗","فروج بروستد قطع + وجبة كريسبي","Parça Broasted Tavuk + Crispy Menü",650],
["🌯","شاورما 18 قطعة","18 Parça Döner",380],
["🥙","سندويش شاورما + عيران","Döner Sandviç + Ayran",135],
["🥙","شاورما دبل","Double Döner",175],
["🥩","كيلو شيش","1 Kg Şiş",525],
["🥩","كيلو كباب مشوي","1 Kg Izgara Kebap",500],
["🍗","كيلو كريسبي","1 Kg Crispy",650],
["🍗","جناح مشوي","Izgara Kanat",525]
];
let lang="ar",cart=[];
function setLang(l){
 lang=l;
 document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));
 [...document.querySelectorAll(".lang button")].find(b=>(l==="ar"&&b.textContent==="العربية")||(l==="tr"&&b.textContent==="Türkçe")||(l==="en"&&b.textContent==="English")).classList.add("active");
 document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr"; render();
}
function render(){
 const labels=lang==="ar"?["قسم العروض","قسم الشاورما والمشاوي","قسم الفروج","قسم الطلب"]:lang==="tr"?["Kampanyalar","Döner & Izgara","Tavuk","Sipariş"]:["Offers","Döner & Grills","Chicken","Order"];
 document.getElementById("menu").innerHTML=
 `<div class="section">🔥 ${labels[0]}</div>`+
 products.map((p,i)=>`<div class="card"><div><div class="name">${p[0]} ${lang==="ar"?p[1]:p[2]}</div><div class="price">${p[3]} ليرة</div></div><button class="add" onclick="add(${i})">${lang==="ar"?"أضف للطلب":lang==="tr"?"Ekle":"Add to order"}</button></div>`).join("");
 document.getElementById("cartTitle").textContent=lang==="ar"?"🛒 طلبك":lang==="tr"?"🛒 Siparişiniz":"🛒 Your order";
 updateCart();
}
function add(i){cart.push(i);updateCart();}
function updateCart(){
 let box=document.getElementById("cartItems");
 if(!cart.length){box.className="empty";box.textContent=lang==="ar"?"لم تضف أي صنف بعد.":lang==="tr"?"Henüz ürün eklemediniz.":"No items added yet.";document.getElementById("total").textContent=(lang==="ar"?"المجموع: ":lang==="tr"?"Toplam: ":"Total: ")+"0 ليرة";return;}
 box.className="";
 let total=0;
 box.innerHTML=cart.map((i,n)=>{total+=products[i][3];return `<div class="row"><span>${products[i][0]} ${lang==="ar"?products[i][1]:products[i][2]}</span><span>${products[i][3]} ₺ <button onclick="cart.splice(${n},1);updateCart()">✕</button></span></div>`}).join("");
 document.getElementById("total").textContent=(lang==="ar"?"المجموع: ":lang==="tr"?"Toplam: ":"Total: ")+total+" ليرة";
}
function sendOrder(){
 if(!cart.length){alert(lang==="ar"?"أضف صنفاً أولاً":lang==="tr"?"Önce ürün ekleyin":"Please add an item first");return;}
 const name=document.getElementById("customer").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim();
 let total=0, counts={};
 cart.forEach(i=>{total+=products[i][3];counts[i]=(counts[i]||0)+1});
 let lines=Object.entries(counts).map(([i,q])=>`${q}x ${products[i][lang==="ar"?1:2]} - ${products[i][3]*q} ₺`).join("\n");
 let msg=(lang==="ar"?"🍗 طلب جديد - بيت الفروج\n\n":lang==="tr"?"🍗 Yeni Sipariş - Chicken House\n\n":"🍗 New Order - Chicken House\n\n")+lines+
 `\n\n${lang==="ar"?"المجموع":lang==="tr"?"Toplam":"Total"}: ${total} ₺\n${lang==="ar"?"الاسم":lang==="tr"?"Ad":"Name"}: ${name}\n${lang==="ar"?"الهاتف":lang==="tr"?"Telefon":"Phone"}: ${phone}\n${lang==="ar"?"العنوان / الملاحظات":lang==="tr"?"Adres / Not":"Address / Notes"}: ${address}`;
 location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
}
render();
</script>
</body>
</html>
